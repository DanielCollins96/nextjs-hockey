type Post @model @auth(rules: [{allow: private}]) {
  id: ID!
  userId: ID!
  subject: String
  content: String!
  name: String
}

type Comment @model @auth(rules: [{allow: public}]) {
  id: ID!
  PostID: ID
  UserID: ID
  Content: String
}

# Forum auth:
# - Guest reads use Cognito identity-pool IAM (allowUnauthenticatedIdentities).
#   Public IAM is read-only so unauth identities cannot mutate AppSync.
# - Signed-in clients read with Cognito user pools and post through
#   Next.js /api/forum-write (token check + sanitization). They do not
#   get AppSync create/update on these models.
# - Trusted writes use the server IAM principal via private IAM.
#   Identity-pool auth/unauth roles remain denied those mutations in
#   storage/nhljsstorage (DenyForumTrustedMutationPolicy).
type ForumBoard
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  slug: String!
  title: String!
  description: String
  section: String!
  teamAbbrev: String
  sortOrder: Int!
  threadCount: Int
  postCount: Int
  lastPostTitle: String
  lastPostAuthor: String
  lastPostAt: AWSDateTime
}

type ForumThread
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [read] }
    { allow: owner, operations: [read] }
    { allow: private, provider: iam, operations: [create] }
  ])
  @key(name: "byBoard", fields: ["boardSlug", "lastActivityAt"], queryField: "threadsByBoard")
  @key(name: "byFeed", fields: ["feed", "postedAt"], queryField: "threadsByFeed")
  @key(name: "byAuthor", fields: ["authorId", "postedAt"], queryField: "threadsByAuthor")
  @key(name: "byNumber", fields: ["number"], queryField: "threadsByNumber") {
  id: ID!
  number: Int!
  boardSlug: String!
  gameId: String
  feed: String!
  authorId: String!
  title: String!
  body: String!
  authorName: String!
  score: Int!
  replyCount: Int!
  viewCount: Int
  postedAt: AWSDateTime!
  lastActivityAt: AWSDateTime!
  lastPostAuthor: String
  lastPostExcerpt: String
}

type ForumReply
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [read] }
    { allow: owner, operations: [read] }
    { allow: private, provider: iam, operations: [create] }
  ])
  @key(name: "byThread", fields: ["threadId", "postedAt"], queryField: "repliesByThread") {
  id: ID!
  threadId: ID!
  body: String!
  authorName: String!
  authorId: String!
  parentReplyId: ID
  score: Int
  postedAt: AWSDateTime!
}

type ForumVote
  @model
  @auth(rules: [
    { allow: owner, operations: [read] }
  ]) {
  id: ID!
  targetId: ID!
  targetType: String!
  value: Int!
}

type ForumUsage
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: owner, ownerField: "userId", identityClaim: "cognito:username", operations: [read] }
    { allow: private, provider: iam, operations: [create, delete] }
  ])
  @key(name: "byUserDay", fields: ["userId", "day"], queryField: "usageByUserDay") {
  id: ID!
  userId: String!
  day: String!
  kind: String!
}

type ForumCounter
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: private, operations: [read] }
    { allow: private, provider: iam, operations: [create, read, update] }
  ]) {
  id: ID!
  value: Int!
}

type ForumActivity
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [read] }
    { allow: private, provider: iam, operations: [create, update] }
  ])
  @key(name: "byBoardActivity", fields: ["boardSlug", "lastActivityAt"], queryField: "activityByBoard") {
  id: ID!
  boardSlug: String
  lastActivityAt: AWSDateTime
  score: Int
  replyCount: Int
  viewCount: Int
  lastPostAuthor: String
  lastPostExcerpt: String
}
