type Post @model @auth(rules: [{allow: private}]) {
  id: ID!
  userId: ID!
  subject: String
  content: String!
  name: String
}

type Comment @model @auth(rules: [{allow: public}]) {
  id: ID!
  PostID: ID
  UserID: ID
  Content: String
}

type ForumBoard
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
  ]) {
  id: ID!
  slug: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  title: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  description: String @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  section: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  teamAbbrev: String @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  sortOrder: Int! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  threadCount: Int
  postCount: Int
  lastPostTitle: String
  lastPostAuthor: String
  lastPostAt: AWSDateTime
}

type ForumThread
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
    { allow: owner }
  ])
  @key(name: "byBoard", fields: ["boardSlug", "lastActivityAt"], queryField: "threadsByBoard")
  @key(name: "byFeed", fields: ["feed", "postedAt"], queryField: "threadsByFeed")
  @key(name: "byAuthor", fields: ["authorId", "postedAt"], queryField: "threadsByAuthor") {
  id: ID!
  boardSlug: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  gameId: String @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  feed: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  authorId: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  title: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  body: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorName: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  score: Int!
  replyCount: Int!
  viewCount: Int
  postedAt: AWSDateTime! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  lastActivityAt: AWSDateTime!
  lastPostAuthor: String
  lastPostExcerpt: String
}

type ForumReply
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
    { allow: owner }
  ])
  @key(name: "byThread", fields: ["threadId", "postedAt"], queryField: "repliesByThread") {
  id: ID!
  threadId: ID! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  body: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorName: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorId: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  parentReplyId: ID @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
  score: Int
  postedAt: AWSDateTime! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
  ])
}

type ForumVote
  @model
  @auth(rules: [{ allow: owner }]) {
  id: ID!
  targetId: ID!
  targetType: String!
  value: Int!
}

type ForumUsage
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: owner, operations: [create, read] }
  ])
  @key(name: "byUserDay", fields: ["userId", "day"], queryField: "usageByUserDay") {
  id: ID!
  userId: String!
  day: String!
  kind: String!
} 