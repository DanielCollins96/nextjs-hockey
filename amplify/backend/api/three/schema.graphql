type Post @model @auth(rules: [{allow: private}]) {
  id: ID!
  userId: ID!
  subject: String
  content: String!
  name: String
}

type Comment @model @auth(rules: [{allow: public}]) {
  id: ID!
  PostID: ID
  UserID: ID
  Content: String
}

type ForumBoard
  @model
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
  ]) {
  id: ID!
  slug: String!
  title: String!
  description: String
  section: String!
  teamAbbrev: String
  sortOrder: Int!
  threadCount: Int
  postCount: Int
  lastPostTitle: String
  lastPostAuthor: String
  lastPostAt: AWSDateTime
}

type ForumThread
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
    { allow: owner }
  ])
  @key(name: "byBoard", fields: ["boardSlug", "lastActivityAt"], queryField: "threadsByBoard")
  @key(name: "byFeed", fields: ["feed", "postedAt"], queryField: "threadsByFeed")
  @key(name: "byAuthor", fields: ["authorId", "postedAt"], queryField: "threadsByAuthor") {
  id: ID!
  boardSlug: String!
  gameId: String
  feed: String!
  authorId: String!
  title: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  body: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorName: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  score: Int!
  replyCount: Int!
  viewCount: Int
  postedAt: AWSDateTime!
  lastActivityAt: AWSDateTime!
  lastPostAuthor: String
  lastPostExcerpt: String
}

type ForumReply
  @model(subscriptions: { level: off })
  @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read, update] }
    { allow: owner }
  ])
  @key(name: "byThread", fields: ["threadId", "postedAt"], queryField: "repliesByThread") {
  id: ID!
  threadId: ID!
  body: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorName: String! @auth(rules: [
    { allow: public, provider: iam, operations: [read] }
    { allow: private, operations: [create, read] }
    { allow: owner }
  ])
  authorId: String!
  parentReplyId: ID
  score: Int
  postedAt: AWSDateTime!
}

type ForumVote
  @model
  @auth(rules: [{ allow: owner }]) {
  id: ID!
  targetId: ID!
  targetType: String!
  value: Int!
} 